<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" role="img" aria-label="System architecture">
<style>
 text{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;fill:#1c2430}
 .t{font-weight:600}
 .s{font-size:11px;fill:#4a5568}
 .lbl{font-size:11px;fill:#2d3748}
 .in{fill:#e8f1fb;stroke:#4a78b5}
 .pr{fill:#e6f4ea;stroke:#3f8f5b}
 .st{fill:#fff6dc;stroke:#b8891a}
 .an{fill:#efeafa;stroke:#7255b0}
 .gt{fill:#fde9df;stroke:#c25a1f}
 .box rect,.box polygon{stroke-width:1.3}
 .grp{fill:#fafafa;stroke:#9aa5b1;stroke-dasharray:5 4;stroke-width:1.2}
 .edge{fill:none;stroke:#3b4655;stroke-width:1.4}
 .dash{fill:none;stroke:#3b4655;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4655"/></marker></defs>
<rect class="grp" x="4" y="4" width="792" height="250" rx="8"/><text class="s" x="786" y="19" text-anchor="end">Inputs and perception</text><g class="box"><rect class="in" x="16" y="30" width="128" height="44" rx="6"/><text text-anchor="middle"><tspan x="80.0" y="48.0">Scripted scenario</tspan><tspan x="80.0" y="64.0">(text frames, YAML)</tspan></text></g><g class="box"><rect class="pr" x="176" y="30" width="128" height="44" rx="6"/><text text-anchor="middle"><tspan x="240.0" y="56.0">ScriptedProvider</tspan></text></g><path class="edge" d="M144,52 L176,52" marker-end="url(#ah)"/><g class="box"><rect class="in" x="16" y="100" width="128" height="44" rx="6"/><text text-anchor="middle"><tspan x="80.0" y="118.0">Video file</tspan><tspan x="80.0" y="134.0">(decoded with OpenCV)</tspan></text></g><g class="box"><rect class="pr" x="176" y="100" width="116" height="44" rx="6"/><text text-anchor="middle"><tspan x="234.0" y="118.0">Deterministic</tspan><tspan x="234.0" y="134.0">sampler</tspan></text></g><g class="box"><rect class="gt" x="322" y="100" width="116" height="44" rx="6"/><text text-anchor="middle"><tspan x="380.0" y="118.0">Frame-change gate</tspan><tspan x="380.0" y="134.0">(pixel difference)</tspan></text></g><g class="box"><rect class="pr" x="468" y="96" width="148" height="52" rx="6"/><text text-anchor="middle"><tspan x="542.0" y="110.0">Vision provider:</tspan><tspan x="542.0" y="126.0">Gemini (optional)</tspan><tspan x="542.0" y="142.0">or cassette replay</tspan></text></g><path class="edge" d="M144,122 L176,122" marker-end="url(#ah)"/><path class="edge" d="M292,122 L322,122" marker-end="url(#ah)"/><path class="edge" d="M438,122 L468,122" marker-end="url(#ah)"/><text class="lbl" x="453" y="90" text-anchor="middle">accepted</text><g class="box"><rect class="in" x="16" y="180" width="128" height="44" rx="6"/><text text-anchor="middle"><tspan x="80.0" y="198.0">Simulated telemetry</tspan><tspan x="80.0" y="214.0">and timeline</tspan></text></g><g class="box"><rect class="pr" x="176" y="180" width="150" height="44" rx="6"/><text text-anchor="middle"><tspan x="251.0" y="198.0">Nearest-prior</tspan><tspan x="251.0" y="214.0">telemetry association</tspan></text></g><path class="edge" d="M144,202 L176,202" marker-end="url(#ah)"/><g class="box"><rect class="pr" x="650" y="100" width="140" height="70" rx="6"/><text text-anchor="middle"><tspan x="720.0" y="131.0" class="t">Observation</tspan><tspan x="720.0" y="147.0">+ detected objects</tspan></text></g><path class="edge" d="M304,52 L632,52 L632,112 L650,112" marker-end="url(#ah)"/><path class="edge" d="M616,130 L650,130" marker-end="url(#ah)"/><path class="edge" d="M380,144 L380,170 L628,170 L628,150 L650,150" marker-end="url(#ah)"/><text class="lbl" x="505" y="166" text-anchor="middle">skipped: carried forward</text><path class="edge" d="M326,202 L642,202 L642,160 L650,160" marker-end="url(#ah)"/><rect class="grp" x="4" y="270" width="792" height="138" rx="8"/><text class="s" x="786" y="285" text-anchor="end">Memory: SQLite + FTS5 (frame-by-frame index, then derived tables)</text><g class="box"><rect class="st" x="16" y="300" width="130" height="70" rx="6"/><text text-anchor="middle"><tspan x="81.0" y="323.0">frames, telemetry,</tspan><tspan x="81.0" y="339.0">observations,</tspan><tspan x="81.0" y="355.0">objects + FTS5</tspan></text></g><g class="box"><rect class="pr" x="168" y="306" width="104" height="58" rx="6"/><text text-anchor="middle"><tspan x="220.0" y="331.0">Event</tspan><tspan x="220.0" y="347.0">aggregator</tspan></text></g><g class="box"><rect class="st" x="294" y="306" width="84" height="58" rx="6"/><text text-anchor="middle"><tspan x="336.0" y="339.0">events</tspan></text></g><g class="box"><rect class="pr" x="400" y="306" width="96" height="58" rx="6"/><text text-anchor="middle"><tspan x="448.0" y="331.0">Entity linker</tspan><tspan x="448.0" y="347.0">(vehicles)</tspan></text></g><g class="box"><rect class="st" x="518" y="306" width="90" height="58" rx="6"/><text text-anchor="middle"><tspan x="563.0" y="339.0">entities</tspan></text></g><g class="box"><rect class="pr" x="630" y="306" width="84" height="58" rx="6"/><text text-anchor="middle"><tspan x="672.0" y="331.0">Rule engine</tspan><tspan x="672.0" y="347.0">(8 rules)</tspan></text></g><g class="box"><rect class="st" x="724" y="306" width="66" height="58" rx="6"/><text text-anchor="middle"><tspan x="757.0" y="339.0">alerts</tspan></text></g><path class="edge" d="M720,170 L720,250 L81,250 L81,300" marker-end="url(#ah)"/><path class="edge" d="M146,335 L168,335" marker-end="url(#ah)"/><path class="edge" d="M272,335 L294,335" marker-end="url(#ah)"/><path class="edge" d="M378,335 L400,335" marker-end="url(#ah)"/><path class="edge" d="M496,335 L518,335" marker-end="url(#ah)"/><path class="edge" d="M608,335 L630,335" marker-end="url(#ah)"/><path class="edge" d="M714,335 L724,335" marker-end="url(#ah)"/><path class="edge" d="M336,364 L336,390 L672,390 L672,364" marker-end="url(#ah)"/><rect class="grp" x="4" y="424" width="792" height="132" rx="8"/><text class="s" x="786" y="439" text-anchor="end">Analyst (read-only access to the stored evidence)</text><g class="box"><rect class="an" x="16" y="452" width="176" height="60" rx="6"/><text text-anchor="middle"><tspan x="104.0" y="478.0">Bounded read-only tools</tspan><tspan x="104.0" y="494.0">(13, no SQL access)</tspan></text></g><g class="box"><rect class="an" x="224" y="452" width="206" height="60" rx="6"/><text text-anchor="middle"><tspan x="327.0" y="478.0">Offline template analyst</tspan><tspan x="327.0" y="494.0">or LangChain + Gemini</tspan></text></g><g class="box"><rect class="gt" x="462" y="452" width="120" height="60" rx="6"/><text text-anchor="middle"><tspan x="522.0" y="486.0">Citation gate</tspan></text></g><g class="box"><rect class="an" x="614" y="452" width="176" height="60" rx="6"/><text text-anchor="middle"><tspan x="702.0" y="478.0">Cited answer</tspan><tspan x="702.0" y="494.0">or run summary</tspan></text></g><path class="edge" d="M192,482 L224,482" marker-end="url(#ah)"/><path class="edge" d="M430,482 L462,482" marker-end="url(#ah)"/><path class="edge" d="M582,482 L614,482" marker-end="url(#ah)"/><path class="edge" d="M104,408 L104,452" marker-end="url(#ah)"/><text class="lbl" x="132" y="434" text-anchor="middle">queries</text></svg>