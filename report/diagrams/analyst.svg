<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" role="img" aria-label="Analyst path with citation gate">
<style>
 text{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;fill:#1c2430}
 .t{font-weight:600}
 .s{font-size:11px;fill:#4a5568}
 .lbl{font-size:11px;fill:#2d3748}
 .in{fill:#e8f1fb;stroke:#4a78b5}
 .pr{fill:#e6f4ea;stroke:#3f8f5b}
 .st{fill:#fff6dc;stroke:#b8891a}
 .an{fill:#efeafa;stroke:#7255b0}
 .gt{fill:#fde9df;stroke:#c25a1f}
 .box rect,.box polygon{stroke-width:1.3}
 .grp{fill:#fafafa;stroke:#9aa5b1;stroke-dasharray:5 4;stroke-width:1.2}
 .edge{fill:none;stroke:#3b4655;stroke-width:1.4}
 .dash{fill:none;stroke:#3b4655;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4655"/></marker></defs>
<g class="box"><rect class="in" x="10" y="78" width="86" height="44" rx="6"/><text text-anchor="middle"><tspan x="53.0" y="104.0">Question</tspan></text></g><g class="box"><rect class="an" x="120" y="78" width="130" height="44" rx="6"/><text text-anchor="middle"><tspan x="185.0" y="96.0">AnalystSession</tspan><tspan x="185.0" y="112.0">(last 6 turns)</tspan></text></g><g class="box"><polygon class="gt" points="318,65.0 370.0,100 318,135.0 266.0,100"/><text text-anchor="middle"><tspan x="318" y="96">LLM</tspan><tspan x="318" y="112">configured?</tspan></text></g><g class="box"><rect class="an" x="392" y="68" width="150" height="64" rx="6"/><text text-anchor="middle"><tspan x="467.0" y="88.0">LangChain tool loop</tspan><tspan x="467.0" y="104.0">(at most 6 rounds,</tspan><tspan x="467.0" y="120.0">12 tool calls)</tspan></text></g><g class="box"><rect class="pr" x="392" y="8" width="150" height="36" rx="6"/><text text-anchor="middle"><tspan x="467.0" y="30.0">10 read-only tools</tspan></text></g><g class="box"><polygon class="gt" points="612,63.0 668.0,100 612,137.0 556.0,100"/><text text-anchor="middle"><tspan x="612" y="104">Citation gate</tspan></text></g><g class="box"><rect class="in" x="690" y="78" width="100" height="44" rx="6"/><text text-anchor="middle"><tspan x="740.0" y="104.0">Answer shown</tspan></text></g><g class="box"><rect class="pr" x="268" y="184" width="170" height="50" rx="6"/><text text-anchor="middle"><tspan x="353.0" y="205.0">Deterministic template</tspan><tspan x="353.0" y="221.0">answer (labelled)</tspan></text></g><g class="box"><rect class="an" x="466" y="168" width="116" height="44" rx="6"/><text text-anchor="middle"><tspan x="524.0" y="186.0">One correction</tspan><tspan x="524.0" y="202.0">retry</tspan></text></g><path class="edge" d="M96,100 L120,100" marker-end="url(#ah)"/><path class="edge" d="M250,100 L266,100" marker-end="url(#ah)"/><path class="edge" d="M370,100 L392,100" marker-end="url(#ah)"/><text class="lbl" x="381" y="92" text-anchor="middle">yes</text><path class="edge" d="M467,44 L467,68" marker-end="url(#ah)" marker-start="url(#ah)"/><path class="edge" d="M542,100 L556,100" marker-end="url(#ah)"/><path class="edge" d="M668,100 L690,100" marker-end="url(#ah)"/><text class="lbl" x="679" y="92" text-anchor="middle">pass</text><path class="edge" d="M318,135 L318,184" marker-end="url(#ah)"/><text class="lbl" x="330" y="160" text-anchor="middle">no</text><path class="edge" d="M596,136 L596,152 L530,152 L530,168" marker-end="url(#ah)"/><text class="lbl" x="602" y="150" text-anchor="middle">fail (first time)</text><path class="edge" d="M466,190 L440,190 L440,132" marker-end="url(#ah)"/><path class="edge" d="M640,130 L640,226 L438,226" marker-end="url(#ah)"/><text class="lbl" x="610" y="240" text-anchor="middle">fail again or model error</text><path class="edge" d="M353,234 L353,262 L740,262 L740,122" marker-end="url(#ah)"/></svg>