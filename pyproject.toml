[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-agent"
version = "0.1.0"
description = "Drone Security Analyst Agent prototype (video + telemetry -> events -> alerts -> Q&A)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",               # validates scenario / VLM output, defines domain models
    "opencv-python-headless>=4.8", # video decoding, frame sampling, frame-diff gate
    "numpy>=1.24",                 # pixel arrays (frame gate, synthetic video); opencv needs it too
    "PyYAML>=6.0",                 # scenarios, zones, rule thresholds
    "rich>=13.0",                  # CLI console output
    "google-genai>=2.25",          # official Gemini SDK (optional real FrameDescriber)
    "python-dotenv>=1.0",          # load GEMINI_* from a local, gitignored .env
]

[project.optional-dependencies]
agent = [                          # analyst Q&A layer only (drone_agent/agent/llm.py)
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["drone_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The evaluation harness builds long explanatory prose strings; wrapping them hurts readability.
"drone_agent/eval/*.py" = ["E501"]
# Report tooling builds long HTML strings and tables.
"report/*.py" = ["E501"]
