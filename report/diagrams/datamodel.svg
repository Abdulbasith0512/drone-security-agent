<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-label="Data model">
<style>
 text{font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;fill:#1c2430}
 .t{font-weight:600}
 .s{font-size:11px;fill:#4a5568}
 .lbl{font-size:11px;fill:#2d3748}
 .in{fill:#e8f1fb;stroke:#4a78b5}
 .pr{fill:#e6f4ea;stroke:#3f8f5b}
 .st{fill:#fff6dc;stroke:#b8891a}
 .an{fill:#efeafa;stroke:#7255b0}
 .gt{fill:#fde9df;stroke:#c25a1f}
 .box rect,.box polygon{stroke-width:1.3}
 .grp{fill:#fafafa;stroke:#9aa5b1;stroke-dasharray:5 4;stroke-width:1.2}
 .edge{fill:none;stroke:#3b4655;stroke-width:1.4}
 .dash{fill:none;stroke:#3b4655;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4655"/></marker></defs>
<g class="box"><rect class="in" x="16" y="16" width="200" height="62" rx="6"/><text class="t" x="116.0" y="35" text-anchor="middle">telemetry</text><text class="s" x="26" y="54">sample time, position, altitude</text><text class="s" x="26" y="70">zone, battery (simulated)</text></g><g class="box"><rect class="st" x="16" y="132" width="200" height="62" rx="6"/><text class="t" x="116.0" y="151" text-anchor="middle">frames</text><text class="s" x="26" y="170">frame_id, timestamp, zone</text><text class="s" x="26" y="186">source</text></g><g class="box"><rect class="st" x="300" y="70" width="210" height="78" rx="6"/><text class="t" x="405.0" y="89" text-anchor="middle">observations</text><text class="s" x="310" y="108">one per frame</text><text class="s" x="310" y="124">description, zone, source</text><text class="s" x="310" y="140">telemetry age and stale flag</text></g><g class="box"><rect class="st" x="580" y="16" width="204" height="62" rx="6"/><text class="t" x="682.0" y="35" text-anchor="middle">detected_objects</text><text class="s" x="590" y="54">type, activity</text><text class="s" x="590" y="70">attributes (JSON), confidence</text></g><g class="box"><rect class="st" x="580" y="116" width="204" height="46" rx="6"/><text class="t" x="682.0" y="135" text-anchor="middle">observations_fts (FTS5)</text><text class="s" x="590" y="154">description, objects text, zone</text></g><g class="box"><rect class="pr" x="300" y="250" width="210" height="78" rx="6"/><text class="t" x="405.0" y="269" text-anchor="middle">events</text><text class="s" x="310" y="288">type, zone, first/last seen</text><text class="s" x="310" y="304">attributes, activities</text><text class="s" x="310" y="320">close reason</text></g><g class="box"><rect class="pr" x="16" y="260" width="200" height="62" rx="6"/><text class="t" x="116.0" y="279" text-anchor="middle">entities</text><text class="s" x="26" y="298">coarse attributes</text><text class="s" x="26" y="314">match level (coarse/confirmed)</text></g><g class="box"><rect class="gt" x="580" y="250" width="204" height="62" rx="6"/><text class="t" x="682.0" y="269" text-anchor="middle">alerts</text><text class="s" x="590" y="288">rule, severity, reason</text><text class="s" x="590" y="304">rule facts, entity (optional)</text></g><path class="edge" d="M216,46 L300,96" marker-end="url(#ah)"/><text class="lbl" x="250" y="58" text-anchor="middle">nearest prior</text><path class="edge" d="M216,160 L300,130" marker-end="url(#ah)"/><text class="lbl" x="246" y="156" text-anchor="middle">1 : 1</text><path class="edge" d="M510,100 L580,50" marker-end="url(#ah)"/><text class="lbl" x="550" y="68" text-anchor="middle">1 : n</text><path class="edge" d="M510,140 L580,140" marker-end="url(#ah)"/><text class="lbl" x="546" y="132" text-anchor="middle">indexed by</text><path class="edge" d="M405,216 L405,250" marker-end="url(#ah)" marker-start="url(#ah)"/><text class="lbl" x="413" y="236" text-anchor="middle">event_observations (n : m)</text><path class="edge" d="M300,290 L216,290" marker-end="url(#ah)" marker-start="url(#ah)"/><text class="lbl" x="258" y="282" text-anchor="middle">entity_events</text><path class="edge" d="M510,290 L580,290" marker-end="url(#ah)" marker-start="url(#ah)"/><text class="lbl" x="545" y="282" text-anchor="middle">alert_events</text><path class="dash" d="M580,326 L540,372 L116,372 L116,340" marker-end="url(#ah)"/><text class="lbl" x="340" y="366" text-anchor="middle">alerts may cite an entity</text></svg>